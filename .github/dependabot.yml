version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tw-animate-css"]
      pdf:
        patterns: ["pdf-lib", "pdfjs-dist", "signature_pad"]
      shadcn:
        patterns: ["shadcn", "@base-ui/*", "class-variance-authority", "clsx", "tailwind-merge", "vaul", "sonner"]
      types:
        patterns: ["@types/*"]
      vitest:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "fake-indexeddb", "jsdom"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["ci"]
